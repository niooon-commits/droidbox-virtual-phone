name: Build Android APK & Update Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Update Single Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -lh ~/.android/debug.keystore

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Android APK
        run: |
          echo "Starting Android Gradle build..."
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file was generated by the Gradle build!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" release_assets/DroidBox-VirtualPhone-Latest.apk
          echo "APK_PATH=release_assets/DroidBox-VirtualPhone-Latest.apk" >> $GITHUB_ENV
          ls -lh release_assets/

      - name: Upload or Replace APK in Single Persistent GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest"
          RELEASE_TITLE="DroidBox Virtual Phone (Latest Continuous Build)"
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          RELEASE_NOTES="### 🚀 DroidBox Virtual Android Phone — Latest Rolling Build

          Automated rolling build of DroidBox Virtual Android OS generated by GitHub Actions.

          - **Target Package**: \`org.droidbox.virtualos\`
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Build Timestamp**: \`${BUILD_DATE}\`
          - **Engine**: C++20 Sandboxed Linux Namespaces, Binder Hook, Virtual FS & GMS Bridge
          - **APK Asset**: \`DroidBox-VirtualPhone-Latest.apk\`

          ---
          > 📌 **Single Release Policy**: As configured, there is strictly ONE persistent release for this repository. Every commit to \`main\` automatically replaces the APK file above with the latest verified build."

          echo "Checking if release '$TAG_NAME' already exists..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release '$TAG_NAME' exists. Updating notes and replacing the APK asset..."
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
            gh release upload "$TAG_NAME" release_assets/DroidBox-VirtualPhone-Latest.apk --clobber
          else
            echo "Release '$TAG_NAME' does not exist yet. Creating single release..."
            gh release create "$TAG_NAME" release_assets/DroidBox-VirtualPhone-Latest.apk \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --target main
          fi
          echo "Single Release successfully updated!"
